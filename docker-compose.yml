services:
  bootbot-db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: ./bootbot-db.env
    volumes:
      - ./data/bootbot-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootbot -d bootbot-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  bootbot:
    build: .
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      bootbot-db:
        condition: service_healthy